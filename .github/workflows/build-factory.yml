        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-arm-linux-gnueabihf:
    name: Build for ARM Linux 32bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: arm32-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y g++-arm-linux-gnueabihf libgmp-dev
    - name: Build Dependencies
      run: make -C depends -j$(nproc) HOST=arm-linux-gnueabihf
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/arm-linux-gnueabihf) --enable-glibc-back-compat --enable-reduce-exports LDFLAGS=-static-libstdc++
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        # strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-i686-linux32:
    name: Build for x86 Linux 32bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: i686-linux32-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq gcc-multilib g++-multilib
    - name: Build Dependencies
      run: make -C depends -j$(nproc) HOST=i686-linux-gnu
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/i686-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-riscv64-linux:
    name: Build for RISCV Linux 64bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: riscv64-linux-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq libcap-dev cmake g++-riscv64-linux-gnu
    - name: Build Dependencies
      run: make -C depends NO_QR=1 NO_QT=1 HOST=riscv64-linux-gnu -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --without-gui --prefix=$(realpath depends/riscv64-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        # strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  attach-installers-to-release:
    name: Attach Installers to Release
    needs: [build-x86_64-linux, build-win64, build-osx64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Getting Installers
      uses: actions/download-artifact@v7.0.0
      with:
        path: artifacts
    - name: Attach to Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # The installers arrive in their own artifacts, separate from the loose
        # binaries, so packaging can fail without costing us a binaries upload.
        mkdir -p installers
        cp artifacts/installers-win64/*-win64-setup.exe installers
        cp artifacts/installers-osx64/*.dmg installers
        cp artifacts/installers-x86_64-linux/*.deb installers
        (cd installers && sha256sum * > SHA256SUMS.txt)
        # A tag can be pushed before its release page exists, so open a draft
        # when there is nothing to attach to yet
        gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Installers built by CI."
        gh release upload "$GITHUB_REF_NAME" installers/* --clobber
  test-sanitizers-linux:
    name: Unit Tests (ASan + UBSan, Linux)
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      # Leak detection is off: Berkeley DB and some globals are reclaimed by the
      # OS at exit rather than freed explicitly. ASan is a hard gate: any real
      # memory error (use-after-free, OOB, etc.) aborts and fails the job.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1
      # UBSan is report-only for now (halt_on_error=0): the vendored crypto
      # (RandomX, ethash) uses patterns UBSan flags but that are intentional.
      # Once the first run's logs are used to write a suppressions file, flip
      # this to halt_on_error=1 to make UBSan a hard gate too.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq
    - name: Build Dependencies
      run: make -C depends -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Configure with sanitizers
      run: |
        ./configure --disable-jni --without-gui --enable-tests --disable-bench \
          --with-sanitizers=address,undefined --disable-hardening \
          CXXFLAGS="-O1 -g -fno-omit-frame-pointer" \
          --prefix=$(realpath depends/x86_64-pc-linux-gnu)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil (instrumented)
      run: make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Run sanitized unit tests
      # Curated set of suites known to pass; excludes suites with pre-existing
      # stale-vector failures (bloom, sighash, key_io, netbase, ...) and
      # randomx_tests (its JIT executes generated code that ASan does not
      # instrument). Expand as the remaining suites are fixed.
      run: >
