name: Github Actions CI for Veil
on: [push, pull_request]
env:
  SOURCE_ARTIFACT: source
jobs:
  create-source-distribution:
    name: Create Source Distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: source
    steps:
    - name: Checkout
      uses: actions/checkout@v5.0.0
    # Needs qt and protobuf to configure qt and include veil-qt.1 in distribution
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y libboost-all-dev libdb-dev libdb++-dev libevent-dev libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev qttools5-dev-tools libprotobuf-dev protobuf-compiler
    - name: Create Distribution Tarball
      run: |
        ./autogen.sh
        ./configure --with-incompatible-bdb
        make dist
    - name: Download Dependencies
      run: make -C depends download
    - name: Create Dependencies Tarball
      run: tar -czf depends.tar.gz depends
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        mv depends.tar.gz veil-*.tar.gz $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.ARTIFACT_DIR }}
  build-x86_64-linux:
    name: Build for x86 Linux 64bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: x86_64-linux-binaries
      TEST_LOG_ARTIFACT_DIR: test-logs
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq
    - name: Build Dependencies
      run: make -C depends -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --enable-tests --with-comparison-tool=no --prefix=$(realpath depends/x86_64-pc-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-win64:
    name: Build for Win64
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: win64-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64
    - name: Switch MinGW GCC and G++ to POSIX Threading
      run: |
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
    - name: Build Dependencies
      run: make -C depends -j$(nproc) HOST=x86_64-w64-mingw32
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/x86_64-w64-mingw32)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        strip $SOURCE_ARTIFACT/src/{veil-cli.exe,veil-tx.exe,veild.exe,qt/veil-qt.exe}
        mv $SOURCE_ARTIFACT/src/{veil-cli.exe,veil-tx.exe,veild.exe,qt/veil-qt.exe} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-osx64:
    name: Build for MacOSX
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: macosx-x86_64-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}

    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-setuptools libcap-dev zlib1g-dev cmake
        sudo -H pip install setuptools

    - name: Work around missing libtinfo.so.5 for macOS cross-toolchain
      run: |
        # Try to install libtinfo5 if it's in the repo
        if apt-cache show libtinfo5 >/dev/null 2>&1; then
          sudo apt-get install -y libtinfo5
        fi
        # If still no libtinfo.so.5, symlink it to libtinfo.so.6
        if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] && [ -f /usr/lib/x86_64-linux-gnu/libtinfo.so.6 ]; then
          echo "Creating libtinfo.so.5 -> libtinfo.so.6 symlink..."
          sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        fi

    - name: Get macOS SDK
      run: |
        mkdir -p depends/sdk-sources
        mkdir -p depends/SDKs
        curl https://bitcoincore.org/depends-sources/sdks/Xcode-11.3.1-11C505-extracted-SDK-with-libcxx-headers.tar.gz -o depends/sdk-sources/Xcode-11.3.1-11C505-extracted-SDK-with-libcxx-headers.tar.gz
        tar -C depends/SDKs -xf depends/sdk-sources/Xcode-11.3.1-11C505-extracted-SDK-with-libcxx-headers.tar.gz
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    - name: Build Dependencies
      run: make -C depends HOST=x86_64-apple-darwin18 -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    - name: Build Veil
      run: |
        ./configure --enable-c++17 --disable-jni --prefix=$(realpath depends/x86_64-apple-darwin18)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        #strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR

    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-aarch64-linux:
    name: Build for ARM Linux 64bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: aarch64-linux-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq libcap-dev cmake g++-aarch64-linux-gnu
    - name: Build Dependencies
      run: make -C depends HOST=aarch64-linux-gnu -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/aarch64-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        # strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-arm-linux-gnueabihf:
    name: Build for ARM Linux 32bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: arm32-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y g++-arm-linux-gnueabihf libgmp-dev
    - name: Build Dependencies
      run: make -C depends -j$(nproc) HOST=arm-linux-gnueabihf
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/arm-linux-gnueabihf) --enable-glibc-back-compat --enable-reduce-exports LDFLAGS=-static-libstdc++
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        # strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-i686-linux32:
    name: Build for x86 Linux 32bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: i686-linux32-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq gcc-multilib g++-multilib
    - name: Build Dependencies
      run: make -C depends -j$(nproc) HOST=i686-linux-gnu
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/i686-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-riscv64-linux:
    name: Build for RISCV Linux 64bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: riscv64-linux-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq libcap-dev cmake g++-riscv64-linux-gnu
    - name: Build Dependencies
      run: make -C depends NO_QR=1 NO_QT=1 HOST=riscv64-linux-gnu -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --without-gui --prefix=$(realpath depends/riscv64-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        # strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  test-sanitizers-linux:
    name: Unit Tests (ASan + UBSan, Linux)
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      # Leak detection is off: Berkeley DB and some globals are reclaimed by the
      # OS at exit rather than freed explicitly. ASan is a hard gate: any real
      # memory error (use-after-free, OOB, etc.) aborts and fails the job.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1
      # UBSan is report-only for now (halt_on_error=0): the vendored crypto
      # (RandomX, ethash) uses patterns UBSan flags but that are intentional.
      # Once the first run's logs are used to write a suppressions file, flip
      # this to halt_on_error=1 to make UBSan a hard gate too.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq
    - name: Build Dependencies
      run: make -C depends -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Configure with sanitizers
      run: |
        ./configure --disable-jni --without-gui --enable-tests --disable-bench \
          --with-sanitizers=address,undefined --disable-hardening \
          CXXFLAGS="-O1 -g -fno-omit-frame-pointer" \
          --prefix=$(realpath depends/x86_64-pc-linux-gnu)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil (instrumented)
      run: make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Run sanitized unit tests
      # Curated set of suites known to pass; excludes suites with pre-existing
      # stale-vector failures (bloom, sighash, key_io, netbase, ...) and
      # randomx_tests (its JIT executes generated code that ASan does not
      # instrument). Expand as the remaining suites are fixed.
      run: >
        src/test/test_veil --catch_system_errors=no
        --run_test=crypto_tests,random_tests,serialize_tests,streams_tests,prevector_tests,uint256_tests,allocator_tests,sanity_tests,scheduler_tests,bech32_tests,bip32_tests,net_tests,addrman_tests,blockencodings_tests,denialofservice_tests,monthly_rewards_tests,progpow_tests,zerocoin_implementation_tests
      working-directory: ${{ env.SOURCE_ARTIFACT }}
  build-macos-arm64-native:
    name: Native Build + Tests (macOS arm64)
    runs-on: macos-14
    env:
      ARTIFACT_DIR: macosx-arm64-binaries
      # Quiet Homebrew's non-fatal env hints and the deprecation nags for the
      # two formulas below (both are intentional and still install).
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
    - name: Checkout
      uses: actions/checkout@v5.0.0
    - name: Install Required Packages
      # Formula notes:
      #  - berkeley-db@4: deprecated upstream but REQUIRED - the wallet uses the
      #    BDB 4.8 on-disk format; a newer BDB would change wallet.dat.
      #  - boost@1.85: pinned because the tree's AX_BOOST_* autoconf macros
      #    cannot resolve Boost 1.90+ (the current unversioned formula), which
      #    fails configure with "Could not find a version of the library!".
      #    Removing this pin needs an ax_boost_base.m4 modernization (tracked).
      # The untrusted aws/tap is pre-installed on the runner image and unrelated
      # to our formulas; untap it to silence the tap-trust warning.
      run: |
        brew untap aws/tap 2>/dev/null || true
        # librsvg (rsvg-convert) is needed by `make deploy` to render the
        # .dmg background image; it is not preinstalled on the macOS runner.
        brew install autoconf automake libtool pkgconf berkeley-db@4 boost@1.85 gmp libevent zeromq miniupnpc qt@5 protobuf librsvg
    - name: Autogen
      run: ./autogen.sh
    - name: Configure
      # qt@5 is keg-only (like berkeley-db@4/boost@1.85 above), so it needs an
      # explicit pkgconfig path and --with-qt-bindir for moc/uic/rcc/lrelease.
      run: >
        ./configure --with-gui=yes --disable-bench
        BDB_LIBS="-L$(brew --prefix berkeley-db@4)/lib -ldb_cxx-4.8"
        BDB_CFLAGS="-I$(brew --prefix berkeley-db@4)/include"
        CPPFLAGS="-I$(brew --prefix gmp)/include -DBOOST_NO_CXX98_FUNCTION_BASE"
        LDFLAGS="-L$(brew --prefix gmp)/lib"
        PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix zeromq)/lib/pkgconfig:$(brew --prefix qt@5)/lib/pkgconfig"
        --with-qt-bindir="$(brew --prefix qt@5)/bin"
        --with-boost="$(brew --prefix boost@1.85)"
    - name: Build
      run: make -j$(sysctl -n hw.ncpu)
    - name: Run unit tests
      # Same curated green subset as the sanitizer job. Native arm64 build,
      # which is not otherwise exercised (build-osx64 is cross-compiled from
      # Linux and runs no tests).
      run: >
        src/test/test_veil --catch_system_errors=no
        --run_test=crypto_tests,random_tests,serialize_tests,streams_tests,prevector_tests,uint256_tests,allocator_tests,sanity_tests,scheduler_tests,bech32_tests,bip32_tests,net_tests,addrman_tests,blockencodings_tests,denialofservice_tests,monthly_rewards_tests,progpow_tests,zerocoin_implementation_tests
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        strip src/veil-cli src/veil-tx src/veild
        mv src/veil-cli src/veil-tx src/veild src/qt/veil-qt $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
    - name: Build Veil-Qt.app and .dmg
      # Native build machine is darwin, so `make deploy` takes the BUILD_DARWIN
      # path in Makefile.am and calls contrib/macdeploy/macdeployqtplus directly
      # with hdiutil (no cross-compile toolchain env vars needed). Output is
      # Veil-Core.dmg (from PACKAGE_NAME "Veil Core" in configure.ac), containing
      # Veil-Qt.app.
      run: make deploy
    - name: Upload Veil-Qt.dmg
      uses: actions/upload-artifact@v6.0.0
      with:
        name: macosx-arm64-Veil-Qt-dmg
        path: Veil-Core.dmg
