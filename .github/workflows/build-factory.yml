name: Github Actions CI for Veil
on: [push, pull_request, workflow_dispatch]
env:
  SOURCE_ARTIFACT: source
jobs:
  create-source-distribution:
    name: Create Source Distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: source
    steps:
    - name: Checkout
      uses: actions/checkout@v5.0.0
    # Needs qt and protobuf to configure qt and include veil-qt.1 in distribution
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y libboost-all-dev libdb-dev libdb++-dev libevent-dev libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev qttools5-dev-tools libprotobuf-dev protobuf-compiler
    - name: Create Distribution Tarball
      run: |
        ./autogen.sh
        ./configure --with-incompatible-bdb
        make dist
    - name: Download Dependencies
      run: make -C depends download
    - name: Create Dependencies Tarball
      run: tar -czf depends.tar.gz depends
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        mv depends.tar.gz veil-*.tar.gz $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.ARTIFACT_DIR }}
  build-x86_64-linux:
    name: Build for x86 Linux 64bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: x86_64-linux-binaries
      TEST_LOG_ARTIFACT_DIR: test-logs
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq dpkg-dev imagemagick
    - name: Build Dependencies
      run: make -C depends -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --enable-tests --with-comparison-tool=no --prefix=$(realpath depends/x86_64-pc-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    # Builds a .deb so Debian/Ubuntu/Mint users get a double click install and a
    # Veil entry in the application menu instead of a folder of loose binaries.
    - name: Build Debian Package
      run: |
        VERSION=$(ls $SOURCE_ARTIFACT/veil-*.tar.gz | sed 's|.*/veil-||; s|\.tar\.gz$||')
        PKG=veil-deb
        mkdir -p $PKG/DEBIAN $PKG/usr/bin $PKG/usr/share/applications \
                 $PKG/usr/share/pixmaps $PKG/usr/share/doc/veil
        cp $ARTIFACT_DIR/{veil-cli,veil-tx,veild,veil-qt} $PKG/usr/bin
        cp $SOURCE_ARTIFACT/COPYING $PKG/usr/share/doc/veil/copyright
        ICON=$SOURCE_ARTIFACT/src/qt/res/icons/bitcoin.png
        for SIZE in 32 64 128 256; do
          mkdir -p $PKG/usr/share/icons/hicolor/${SIZE}x${SIZE}/apps
          convert $ICON -resize ${SIZE}x${SIZE} $PKG/usr/share/icons/hicolor/${SIZE}x${SIZE}/apps/veil.png
        done
        cp $PKG/usr/share/icons/hicolor/256x256/apps/veil.png $PKG/usr/share/pixmaps/veil.png
        cat > $PKG/usr/share/applications/veil-qt.desktop <<'DESKTOP'
        [Desktop Entry]
        Type=Application
        Name=Veil
        GenericName=Veil Wallet
        Comment=Send and receive Veil
        Exec=veil-qt %u
        Icon=veil
        Terminal=false
        Categories=Office;Finance;
        MimeType=x-scheme-handler/veil;
        DESKTOP
        # Read the real shared library deps off the binary instead of guessing
        mkdir -p debian
        printf 'Source: veil\n\nPackage: veil\nArchitecture: amd64\n' > debian/control
        DEPENDS=$(dpkg-shlibdeps --ignore-missing-info -O $PKG/usr/bin/veil-qt 2>/dev/null | sed 's/^shlibs:Depends=//') || true
        [ -n "$DEPENDS" ] || DEPENDS='libc6, libstdc++6, libgcc-s1'
        # dpkg-deb does not work this out on its own, and without it apt reports
        # "0 B of additional disk space will be used" and cannot warn on a full disk
        INSTALLED_SIZE=$(du -ks $PKG/usr | cut -f1)
        cat > $PKG/DEBIAN/control <<CONTROL
        Package: veil
        Version: $VERSION
        Architecture: amd64
        Installed-Size: $INSTALLED_SIZE
        Section: utils
        Priority: optional
        Maintainer: Veil Project <https://github.com/Veil-Project/veil>
        Homepage: https://veil-project.com/
        Depends: $DEPENDS
        Description: Veil privacy focused cryptocurrency wallet
         Veil is a privacy focused cryptocurrency built on RingCT and zerocoin.
         This package installs the Veil-Qt wallet along with the veild daemon
         and the veil-cli and veil-tx command line tools.
        CONTROL
        dpkg-deb --build --root-owner-group $PKG $ARTIFACT_DIR/veil-$VERSION-amd64.deb
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-win64:
    name: Build for Win64
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: win64-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 nsis
    - name: Switch MinGW GCC and G++ to POSIX Threading
      run: |
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
    - name: Build Dependencies
      run: make -C depends -j$(nproc) HOST=x86_64-w64-mingw32
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/x86_64-w64-mingw32)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    # Produces veil-<version>-win64-setup.exe from share/setup.nsi: start menu
    # entries, the veil: URI handler and an uninstaller, same as any other
    # Windows program. Has to run before the binaries are moved out of src/.
    - name: Build Windows Installer
      run: make deploy
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        strip $SOURCE_ARTIFACT/src/{veil-cli.exe,veil-tx.exe,veild.exe,qt/veil-qt.exe}
        mv $SOURCE_ARTIFACT/src/{veil-cli.exe,veil-tx.exe,veild.exe,qt/veil-qt.exe} $ARTIFACT_DIR
        mv $SOURCE_ARTIFACT/veil-*-win64-setup.exe $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-osx64:
    name: Build for MacOSX
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: macosx-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}

    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-setuptools libcap-dev zlib1g-dev cmake \
          genisoimage librsvg2-bin imagemagick libtiff-tools
        sudo -H pip install setuptools
        # macdeployqtplus and custom_dsstore.py need these to lay out the .dmg,
        # installed against the same python3 that configure will pick up
        sudo -H python3 -m pip install ds_store mac_alias biplist

    - name: Work around missing libtinfo.so.5 for macOS cross-toolchain
      run: |
        # Try to install libtinfo5 if it's in the repo
        if apt-cache show libtinfo5 >/dev/null 2>&1; then
          sudo apt-get install -y libtinfo5
        fi
        # If still no libtinfo.so.5, symlink it to libtinfo.so.6
        if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] && [ -f /usr/lib/x86_64-linux-gnu/libtinfo.so.6 ]; then
          echo "Creating libtinfo.so.5 -> libtinfo.so.6 symlink..."
          sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        fi

    - name: Get macOS SDK
      run: |
        mkdir -p depends/sdk-sources
        mkdir -p depends/SDKs
        curl https://bitcoincore.org/depends-sources/sdks/Xcode-11.3.1-11C505-extracted-SDK-with-libcxx-headers.tar.gz -o depends/sdk-sources/Xcode-11.3.1-11C505-extracted-SDK-with-libcxx-headers.tar.gz
        tar -C depends/SDKs -xf depends/sdk-sources/Xcode-11.3.1-11C505-extracted-SDK-with-libcxx-headers.tar.gz
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    - name: Build Dependencies
      run: make -C depends HOST=x86_64-apple-darwin18 -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    - name: Build Veil
      run: |
        ./configure --enable-c++17 --disable-jni --prefix=$(realpath depends/x86_64-apple-darwin18)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    # Wraps Veil-Qt.app in the usual drag-to-Applications disk image. The .dmg
    # is unsigned, so first launch is right click -> Open.
    - name: Build Disk Image
      run: make deploy
      working-directory: ${{ env.SOURCE_ARTIFACT }}

    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        #strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
        VERSION=$(ls $SOURCE_ARTIFACT/veil-*.tar.gz | sed 's|.*/veil-||; s|\.tar\.gz$||')
        mv $SOURCE_ARTIFACT/*.dmg $ARTIFACT_DIR/veil-$VERSION-osx64.dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-aarch64-linux:
    name: Build for ARM Linux 64bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: aarch64-linux-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq libcap-dev cmake g++-aarch64-linux-gnu
    - name: Build Dependencies
      run: make -C depends HOST=aarch64-linux-gnu -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/aarch64-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        # strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-arm-linux-gnueabihf:
    name: Build for ARM Linux 32bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: arm32-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y g++-arm-linux-gnueabihf libgmp-dev
    - name: Build Dependencies
      run: make -C depends -j$(nproc) HOST=arm-linux-gnueabihf
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/arm-linux-gnueabihf) --enable-glibc-back-compat --enable-reduce-exports LDFLAGS=-static-libstdc++
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        # strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-i686-linux32:
    name: Build for x86 Linux 32bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: i686-linux32-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq gcc-multilib g++-multilib
    - name: Build Dependencies
      run: make -C depends -j$(nproc) HOST=i686-linux-gnu
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --prefix=$(realpath depends/i686-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild,qt/veil-qt} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  build-riscv64-linux:
    name: Build for RISCV Linux 64bit
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: riscv64-linux-binaries
    steps:
    - name: Getting Source
      uses: actions/download-artifact@v7.0.0
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: ${{ env.SOURCE_ARTIFACT }}
    - name: Extract Archives
      run: |
        tar -xzf depends.tar.gz
        tar -xzf veil-*.tar.gz --strip-components=1
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y python3-zmq libcap-dev cmake g++-riscv64-linux-gnu
    - name: Build Dependencies
      run: make -C depends NO_QR=1 NO_QT=1 HOST=riscv64-linux-gnu -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Build Veil
      run: |
        ./configure --disable-jni --without-gui --prefix=$(realpath depends/riscv64-linux-gnu)
        make -j$(nproc)
      working-directory: ${{ env.SOURCE_ARTIFACT }}
    - name: Prepare Files for Artifact
      run: |
        mkdir -p $ARTIFACT_DIR
        # strip fails with "Unable to recognise the format of the input file"
        # strip $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild}
        mv $SOURCE_ARTIFACT/src/{veil-cli,veil-tx,veild} $ARTIFACT_DIR
    - name: Upload Artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ env.ARTIFACT_DIR }}
        path: ${{ env.ARTIFACT_DIR }}
  attach-installers-to-release:
    name: Attach Installers to Release
    needs: [build-x86_64-linux, build-win64, build-osx64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Getting Installers
      uses: actions/download-artifact@v7.0.0
      with:
        path: artifacts
    - name: Attach to Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        mkdir -p installers
        cp artifacts/win64-binaries/*-win64-setup.exe installers
        cp artifacts/macosx-binaries/*.dmg installers
        cp artifacts/x86_64-linux-binaries/*.deb installers
        (cd installers && sha256sum * > SHA256SUMS.txt)
        # A tag can be pushed before its release page exists, so open a draft
        # when there is nothing to attach to yet
        gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Installers built by CI."
        gh release upload "$GITHUB_REF_NAME" installers/* --clobber
